spring:
  application:
    name: lifeos-trigger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trigger}
    username: ${DB_USERNAME:trigger}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A new consumer group (first deployment) starts from the oldest event, so no decision or week is missed.
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          # Inner security layer: the service validates the JWT itself (lifeos-base-web).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lifeos}
          # Keycloak must add this audience to access tokens (audience mapper on the lifeos realm).
          audiences: ${JWT_AUDIENCES:lifeos-api}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

lifeos:
  messaging:
    outbox:
      topic: lifeos.trigger.events.v1
    inbox:
      consumer: trigger
  trigger:
    strategy-topic: lifeos.strategy.events.v1
    # Local times, in each user's own time zone.
    schedule:
      decision-time: "09:00"        # a decision's review date and DATE reopen triggers
      weekly-review-time: "18:00"   # Sunday of the active week
      drift-check-time: "18:00"     # Thursday of the active week
    runner:
      interval-ms: 60000            # how often due jobs are looked for
      initial-delay-ms: 10000
    drift:
      behind-pace-share: 0.5        # at the mid-week check, done below half of the planned minutes is drift
