name: ci

# Verify only. Nothing is published from main or from pull requests;
# packages and images come from release/X.Y.Z branches (see release.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

# Maven resolves lifeos-* artifacts from GitHub Packages with this token.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test
        run: mvn -B verify
